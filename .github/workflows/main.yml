name: Build Sideloadable Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Restore Persistent Debug Keystore (if configured)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 --decode > ~/.android/debug.keystore
            echo "Restored persistent debug.keystore."
          fi

      - name: Read Version Metadata from package.json
        run: |
          node << 'NODE_EOF'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const version = pkg.version || '0.6.0';
          const [maj = 0, min = 0, pat = 0] = version.split('.').map(Number);
          const code = maj * 10000 + min * 100 + pat;
          fs.appendFileSync(
            process.env.GITHUB_ENV,
            'APP_VERSION=' + version + '\nAPP_VERSION_CODE=' + code + '\n'
          );
          console.log('Detected version ' + version + ' (versionCode ' + code + ')');
          NODE_EOF

      - name: Accept Preinstalled Android SDK Licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Install Dependencies
        run: npm install

      - name: Build Web Bundle
        run: npm run build

      - name: Add Android Platform (if missing)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Version Metadata, Permissions & Custom Cali App Icon
        run: |
          node << 'NODE_EOF'
          const fs = require('fs');
          const path = require('path');

          // 1. Sync versionCode & versionName
          const gradlePath = 'android/app/build.gradle';
          let gradle = fs.readFileSync(gradlePath, 'utf8');
          gradle = gradle.replace(/versionCode\s+\d+/, 'versionCode ' + process.env.APP_VERSION_CODE);
          gradle = gradle.replace(/versionName\s+"[^"]+"/, 'versionName ' + JSON.stringify(process.env.APP_VERSION));
          fs.writeFileSync(gradlePath, gradle, 'utf8');

          // 2. Inject Android Permissions
          const manifestPath = 'android/app/src/main/AndroidManifest.xml';
          let xml = fs.readFileSync(manifestPath, 'utf8');
          const perms = [
            'android.permission.INTERNET',
            'android.permission.ACCESS_NETWORK_STATE',
            'android.permission.RECORD_AUDIO',
            'android.permission.MODIFY_AUDIO_SETTINGS',
            'android.permission.WAKE_LOCK',
            'android.permission.FOREGROUND_SERVICE',
            'android.permission.POST_NOTIFICATIONS',
            'android.permission.READ_EXTERNAL_STORAGE',
            'android.permission.WRITE_EXTERNAL_STORAGE'
          ];
          for (const perm of perms) {
            if (!xml.includes(perm)) {
              xml = xml.replace(
                '<application',
                '    <uses-permission android:name="' + perm + '" />\n    <application'
              );
            }
          }
          fs.writeFileSync(manifestPath, xml, 'utf8');

          // 3. Inject Custom Cali Monolith Violet Adaptive Launcher Icon
          const resBase = 'android/app/src/main/res';
          fs.mkdirSync(path.join(resBase, 'drawable'), { recursive: true });
          fs.mkdirSync(path.join(resBase, 'mipmap-anydpi-v26'), { recursive: true });

          const bgVector = `<vector xmlns:android="http://schemas.android.com/apk/res/android"
    android:width="108dp"
    android:height="108dp"
    android:viewportWidth="108"
    android:viewportHeight="108">
    <path android:fillColor="#121215" android:pathData="M0,0h108v108h-108z"/>
    <path android:fillColor="#6C4CD1" android:pathData="M54,14a40,40 0 1,0 0,80a40,40 0 1,0 0,-80z"/>
</vector>`;

          const fgVector = `<vector xmlns:android="http://schemas.android.com/apk/res/android"
    android:width="108dp"
    android:height="108dp"
    android:viewportWidth="108"
    android:viewportHeight="108">
    <path android:fillColor="#FFFFFF"
        android:pathData="M54,28 L60.5,47.5 L80,54 L60.5,60.5 L54,80 L47.5,60.5 L28,54 L47.5,47.5 Z"/>
    <path android:fillColor="#FFB732"
        android:pathData="M73,32 a4,4 0 1,0 0.1,0 Z"/>
</vector>`;

          const adaptiveXml = `<?xml version="1.0" encoding="utf-8"?>
<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
    <background android:drawable="@drawable/ic_cali_bg" />
    <foreground android:drawable="@drawable/ic_cali_fg" />
</adaptive-icon>`;

          fs.writeFileSync(path.join(resBase, 'drawable', 'ic_cali_bg.xml'), bgVector, 'utf8');
          fs.writeFileSync(path.join(resBase, 'drawable', 'ic_cali_fg.xml'), fgVector, 'utf8');
          fs.writeFileSync(path.join(resBase, 'mipmap-anydpi-v26', 'ic_launcher.xml'), adaptiveXml, 'utf8');
          fs.writeFileSync(path.join(resBase, 'mipmap-anydpi-v26', 'ic_launcher_round.xml'), adaptiveXml, 'utf8');
          console.log('Synced v' + process.env.APP_VERSION + ' metadata, permissions & custom Cali icon.');
          NODE_EOF

      - name: Sync Capacitor Assets
        run: npx cap sync android

      - name: Build Debug APK (Sideload Ready)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Sideloadable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cali-pwa-agency-v${{ env.APP_VERSION }}-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
