name: Build Sideloadable Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Read Version Metadata from package.json
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          VERSION_CODE=$(node -e "const [x,y,z]=require('./package.json').version.split('.').map(Number); console.log(x*10000 + y*100 + z);")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Building Cali PWA Agency v$VERSION (versionCode $VERSION_CODE)"

      - name: Accept Preinstalled Android SDK Licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Install Dependencies
        run: npm install

      - name: Build Web Bundle
        run: npm run build

      - name: Add Android Platform (if missing)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Version Metadata & Android Permissions
        env:
          APP_VERSION: ${{ steps.meta.outputs.version }}
          APP_VERSION_CODE: ${{ steps.meta.outputs.version_code }}
        run: |
          node -e '
            const fs = require("fs");
            const gradlePath = "android/app/build.gradle";
            let gradle = fs.readFileSync(gradlePath, "utf8");
            gradle = gradle.replace(/versionCode\s+\d+/, "versionCode " + process.env.APP_VERSION_CODE);
            gradle = gradle.replace(/versionName\s+"[^"]+"/, "versionName " + JSON.stringify(process.env.APP_VERSION));
            fs.writeFileSync(gradlePath, gradle, "utf8");

            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(manifestPath, "utf8");
            const perms = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.RECORD_AUDIO",
              "android.permission.MODIFY_AUDIO_SETTINGS",
              "android.permission.WAKE_LOCK",
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.POST_NOTIFICATIONS"
            ];
            for (const perm of perms) {
              if (!xml.includes(perm)) {
                xml = xml.replace("<application", "    <uses-permission android:name=\"" + perm + "\" />\n    <application");
              }
            }
            fs.writeFileSync(manifestPath, xml, "utf8");
          '

      - name: Sync Capacitor Assets
        run: npx cap sync android

      - name: Build Debug APK (Sideload Ready)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Sideloadable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cali-pwa-agency-v${{ steps.meta.outputs.version }}-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
